server:
  port: 8080

spring:
  application:
    name: soundpass-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    mongodb:
      uri: ${MONGO_URI}

soundpass:
  jwt:
    secreto: ${JWT_SECRET}
    expiracion-minutos: 60
  admin:
    correo: ${ADMIN_CORREO:}
    contrasena: ${ADMIN_CONTRASENA:}

management:
  health:
    mongo:
      enabled: false   # MongoDB es opcional: no debe tumbar el health check
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true