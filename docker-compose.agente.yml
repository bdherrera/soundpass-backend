# Entorno de trabajo del agente (solo desarrollo). Las bases de datos son desechables y
# no publican puertos en el host, así que no chocan con las VMs de PostgreSQL y MongoDB.
# Versiones alineadas con las VMs: PostgreSQL 18 y MongoDB 8.0.
name: soundpass-agente

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: soundpass
      POSTGRES_USER: soundpass
      POSTGRES_PASSWORD: soundpass_test
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U soundpass -d soundpass"]
      interval: 3s
      timeout: 3s
      retries: 40

  mongo:
    image: mongo:8.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: soundpass
      MONGO_INITDB_ROOT_PASSWORD: soundpass_test
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  agente:
    build:
      context: .
      dockerfile: Dockerfile.agente
    image: soundpass-agente:local
    env_file: .env.agente
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: soundpass
      DB_USER: soundpass
      DB_PASSWORD: soundpass_test
      MONGO_URI: mongodb://soundpass:soundpass_test@mongo:27017/soundpass?authSource=admin
      JWT_SECRET: clave-solo-para-pruebas-cambiar-en-despliegue-0123456789
    volumes:
      - .:/work
      - m2:/home/node/.m2
    working_dir: /work
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 1536m

volumes:
  m2:
